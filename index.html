<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- 只约束「连接」与「图片」两个维度；不写 default-src，故对脚本/样式/字体毫无影响。
         connect-src：'self'（网关同源 /api）· *:8090（直连）· ws://*:8090 / wss://*:8090
           （WebSocket 属独立方案，*:8090 不覆盖；当前未使用，预留给实时推送）
           · <%= PB_CONNECT_SRC %>（构建期按 PUBLIC_PB_URL 追加，留空即空串。必须由构建期
           产出：*:8090 只覆盖 8090 端口，而 PUBLIC_PB_URL 常写成 https://host，实测被拦死）
         img-src：图片通道的唯一防线 —— JS 侧只 patch 了 fetch/XHR/sendBeacon，
           `new Image().src = …` 绕开它们（实测该通道确实出网）。界面不渲染 <img>，
           同源 favicon 由 'self' 覆盖，预览走 <video>+blob:，收紧不损伤功能。
         覆盖范围与仍敞开的三条通道（<script src> / <link rel=stylesheet> / <iframe src>）
         见 RUN.md「遥测拦截：三层（内联脚本 / 运行期模块 / CSP）」。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' *:8090 ws://*:8090 wss://*:8090<%= PB_CONNECT_SRC %>; img-src 'self' data: blob: *:8090<%= PB_CONNECT_SRC %>"
    />

    <script>
      // 界面语言按浏览器语言在 zh / en 间切换（见 src/lib/i18n.ts），
      // 文档的 lang 也应随之设定，否则英文用户的读屏与断词规则会按中文处理。
      document.documentElement.lang = (navigator.language || '').toLowerCase().startsWith('zh')
        ? 'zh-CN'
        : 'en'
    </script>
    <script>
      // 启动失败的兜底（W4/P3）。
      //
      // 产物 JS 404、被静态服务的 page-fallback 换成 HTML（解析即语法错误）、或启动期
      // 抛异常时，页面会停在空白的 #root：用户只看到白屏，也不知道该找谁。下面两个监听
      // 覆盖这三类错误，把原因写进页面。
      //
      // 三个刻意的取舍：
      //  1) 用**捕获阶段**监听 <script> 的资源错误 —— 资源错误不冒泡，只有 capture 收得到。
      //  2) 判定前留 1.2 秒宽限：脚本失败未必致命（例如可选脚本挂了而主流程仍能起来），
      //     只有 #root 依然一个子节点都没有时，才认定为启动失败。
      //  3) 不做「N 秒未挂载」看门狗：慢网络下会误报，宁可不报。
      ;(function () {
        var GRACE_MS = 1200
        var TRIES = 40
        var shown = false

        function box(zh, en, detail) {
          var html =
            '<div style="max-width:36rem;margin:12vh auto;padding:1.5rem;font:16px/1.6 system-ui,-apple-system,sans-serif;color:#111">' +
            '<h1 style="font-size:1.25rem;font-weight:700;margin:0 0 .5rem">' +
            zh +
            '</h1><p style="margin:0;color:#444">' +
            en +
            '</p>'
          if (detail) {
            html +=
              '<pre style="margin:1rem 0 0;padding:.75rem;background:#f3f4f6;border-radius:.5rem;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px">' +
              detail +
              '</pre>'
          }
          return html + '</div>'
        }

        function render(html) {
          if (shown) return
          var el = document.getElementById('root')
          if (!el) {
            // #root 在文档末尾（body 结束标签之前），晚于本脚本；错误发生在解析期时它还不存在。
            if (TRIES-- > 0) setTimeout(function () { render(html) }, 50)
            else if (document.body) {
              shown = true
              document.body.insertAdjacentHTML('afterbegin', html)
            }
            return
          }
          shown = true
          el.setAttribute('data-load-failed', '1')
          el.innerHTML = html
        }

        function report(zh, en, detail) {
          setTimeout(function () {
            var el = document.getElementById('root')
            // 应用其实起来了就不打扰（兜底只处理「真的没起来」）。
            if (el && el.childElementCount > 0) return
            render(box(zh, en, detail))
          }, GRACE_MS)
        }

        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (t && t !== window) {
              // 只有脚本加载失败才当作启动失败；preload / 图片等失败不致命
              //（MediaPipe 需要时会自己去取 wasm，不能因为预加载失败就报白屏）。
              if (t.tagName === 'SCRIPT') {
                report('页面脚本加载失败', 'A page script failed to load.', String(t.src || '(inline)'))
              }
              return
            }
            report('页面启动失败', 'The page failed to start.', String((e && e.message) || e))
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason
          report('页面启动失败', 'The page failed to start.', String((r && r.message) || r || e))
        })
      })()
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="facedb" />
    <link rel="icon" href="data:," />
    <!-- 预加载首屏必需的模型与 wasm：实测共约 15.8MB，不做预加载时浏览器
         要等到 JS 执行到 initFace() 才开始下载，白白多等数秒。

         三条的 as 与 crossorigin 必须与【实际发起方】一致，否则缓存不命中、白下载一次。
         逐种写法实测（看该文件被请求几次）：
           模型   /face_landmarker.task            as="fetch"  + crossorigin → 1 次
           wasm   /wasm/vision_wasm_internal.wasm  as="fetch"  + crossorigin → 1 次
           loader /wasm/vision_wasm_internal.js    as="script" + crossorigin → 1 次

         loader 由 MediaPipe 动态插入的 <script> 加载（CDP 显示资源类型 Script、发起者
         parser/script），且该 script 带 crossOrigin 属性，所以必须是
         as="script" + crossorigin；写成 as="fetch"、或漏掉 crossorigin，
         都会让它被下载两次（preload 一次、使用方再取一次，多传 323KB）。 -->
    <link rel="preload" href="/face_landmarker.task" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/wasm/vision_wasm_internal.js" as="script" crossorigin="anonymous" />
    <link rel="preload" href="/wasm/vision_wasm_internal.wasm" as="fetch" crossorigin="anonymous" />
    <title>facedb</title>
    <script>
      // 最早的一道防线：MediaPipe(TFLite) 会向 odml.pa.googleapis.com 上报遥测，
      // 本项目处理人脸数据，任何外发都必须拦住。此处内联执行，早于任何模块加载，
      // 与 src/lib/block-telemetry.ts 形成双保险（后者负责应用运行期的调用）。
      (() => {
        // 尾点（FQDN 绝对形式 googleapis.com.）也要拦：new URL() 保留尾点，
        // 旧正则漏掉它，实测能放行到真实网络。
        var BLOCKED = /(^|\.)googleapis\.com\.?$/i
        var isBlocked = function (u) {
          try {
            var h = new URL(typeof u === 'string' ? u : u && u.url ? u.url : String(u), location.href).hostname
            return BLOCKED.test(h)
          } catch (e) {
            return false
          }
        }
        var empty = function () {
          return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } })
        }
        // 与 block-telemetry.ts 一致：本层可还原，装之前先撤掉上一次**内联层**。
        // 模块层用另一个槽位（__facedbBlockModule），两层互不牵连。
        if (window.__facedbBlockInline && window.__facedbBlockInline.uninstall) {
          try {
            window.__facedbBlockInline.uninstall()
          } catch (e) {}
        }
        // 刻意不 bind：bind 会造出新函数对象，上层撤层后 window.fetch 与这里装的就不是同一个了，
        // 「还原」会永远失败。原生 fetch 要求 this 是 window，所以在调用点用 call。
        var of = window.fetch
        var patchedFetch = function (i, init) {
          return isBlocked(i) ? Promise.resolve(empty()) : of.call(window, i, init)
        }
        window.fetch = patchedFetch
        var oo = XMLHttpRequest.prototype.open
        var os = XMLHttpRequest.prototype.send
        var blocked = new WeakSet()
        var patchedOpen = function (m, u) {
          // 必须成对：同一个 XHR 可以反复 open，只 add 不 delete 会让复用的对象被一直拦着，
          // 连真正要发的请求也不发（还伪造 200 '{}'）。与 block-telemetry.ts 保持一致。
          if (isBlocked(u)) blocked.add(this)
          else blocked.delete(this)
          return oo.apply(this, arguments)
        }
        XMLHttpRequest.prototype.open = patchedOpen
        var patchedSend = function () {
          if (blocked.has(this)) {
            // 模拟一次【完整且成功】的响应，与 src/lib/block-telemetry.ts 保持一致：
            // 只补事件而不设 readyState/status/responseText 的话，调用方读到 status=0 会判为失败。
            var self = this
            // abort() 之后不得再派发假事件（调用方会在 abort 里清状态，之后收到 load 会当成成功）
            var aborted = false
            var prevAbort = this.abort
            this.abort = function () {
              aborted = true
              return prevAbort.apply(this, arguments)
            }
            setTimeout(function () {
              if (aborted) return
              var def = function (k, v) {
                Object.defineProperty(self, k, { value: v, configurable: true })
              }
              def('readyState', 4)
              def('status', 200)
              def('statusText', 'OK')
              def('responseText', '{}')
              def('response', '{}')
              self.dispatchEvent(new Event('readystatechange'))
              self.dispatchEvent(new Event('load'))
              self.dispatchEvent(new Event('loadend'))
            }, 0)
            return
          }
          return os.apply(this, arguments)
        }
        XMLHttpRequest.prototype.send = patchedSend
        var patchedBeacon
        if (navigator.sendBeacon) {
          // 不能 bind：bind 造出新函数对象，撤层时按身份还原必然失败
          var ob = navigator.sendBeacon
          patchedBeacon = function (u, d) {
            return isBlocked(u) ? true : ob.call(navigator, u, d)
          }
          navigator.sendBeacon = patchedBeacon
        }
        window.__facedbBlockInline = {
          uninstall: function () {
            // 只还原仍然是我们装的那一层。
            // 【撤层顺序】必须后装先撤（LIFO）：顺序不对时守卫全部落空，函数会静默返回，
            // 调用方以为撤了、补丁却仍生效 —— 所以这里显式告警，不静默。
            var restored = 0
            if (window.fetch === patchedFetch) { window.fetch = of; restored++ }
            if (XMLHttpRequest.prototype.open === patchedOpen) { XMLHttpRequest.prototype.open = oo; restored++ }
            if (XMLHttpRequest.prototype.send === patchedSend) { XMLHttpRequest.prototype.send = os; restored++ }
            if (patchedBeacon && navigator.sendBeacon === patchedBeacon) { navigator.sendBeacon = ob; restored++ }
            var expected = patchedBeacon ? 4 : 3
            if (restored < expected) {
              console.warn('[telemetry] 撤层时本层不在顶层：' + expected + ' 个补丁点只还原了 ' + restored +
                ' 个。撤层必须后装先撤（先撤模块层再撤内联层），否则本层补丁会残留。')
            }
          },
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

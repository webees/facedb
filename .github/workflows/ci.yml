name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 自检 / 类型检查 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 仓库自检（资源指纹 / 迁移不变量 / 文案键对称 / 二进制指纹）
        run: npm run verify

      # 阻断线默认 P1：凭据 / 私钥 / 媒体文件 / 公网 IP / Tailscale 网段 / 超管口令；
      # P2（本机路径 / 私网地址 / 域名 / 邮箱）只提示。可用 LEAK_BLOCK_AT=P0|P1|P2 覆盖。
      - name: 发布卫生闸门（P0 凭据/私钥/媒体 + P1 公网 IP/Tailscale/超管口令 阻断；P2 提示）
        run: npm run verify:publish

      - name: 仓库标准件判据（README / 治理文件 / .github / scripts 交叉核对）
        run: npm run verify:standards

      - name: 配置卫生判据（零命中规则 / 哈希资产保护 / 行尾口径）
        run: npm run verify:hygiene

      - name: 类型检查（样本数 + 阳性对照，防零样本假通过）
        run: npm run verify:types

      # R25-INCIDENT-02：`node_modules/vue-tsc/bin/vue-tsc.js` 曾被写成 17 字节的 shell 桩，
      # 于是 `npx vue-tsc --noEmit` 恒 exit 0 零输出（类型检查整段空转）。该自检把
      # 「可执行文件被桩替换」与「检查器逻辑不判别」两支分开钉住，并确认真仓库未被改动。
      - name: 类型检查判据的自检（真件成立 / shell 桩 / 空转桩 / 像真件但不判别 / 真仓库未被改动）
        run: npm run verify:types-selftest

      - name: 类型检查（原始命令，便于对照报错输出）
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      # 必须在构建之后：该判据要量 dist 的传输面 / 原始总字节 / 逐文件 sha256
      # （缺 dist 时它按零样本纪律判「未判定」并 exit 2，不判通过）
      - name: 产物体积与构成判据（gzip 传输面 / 原始总字节 / 文件名清单 / sha256 锁定）
        run: npm run verify:size

      # 必须在构建之后：该判据要验 dist 里的副本（缺 dist 判「未判定」并 exit 2，不判通过）
      - name: 第三方许可随分发物提供（声明文件 / Apache 全文 / 闭包与 lock 一致 / dist 副本）
        run: npm run verify:notices

      - name: Docker Compose 配置校验
        run: docker compose config -q

  standards-selftest:
    name: 判据自检（变异体必须全部被抓到）
    runs-on: ubuntu-latest
    # 每个变异体都会完整跑一遍判据（含 vue-tsc），单个 job 放不下 15 分钟的墙。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 判据自身的变异自检（66 个变异体必须全部被抓到，且未变异的副本全绿）
        run: npm run verify:standards-selftest

      # 仓库结构面与 CSP 面的判据（verify-repo.mjs）此前**从未在 CI 里自检** ——
      # 它的 33 个变异体只在本地跑，判据被无声削弱时 CI 仍然全绿（R22 实测发现）。
      - name: 仓库判据的变异自检（33 个变异体/零样本/越界场景必须全部符合预期）
        run: npm run verify:selfcheck

      - name: 第三方许可判据的变异自检（9 个变异体 + 缺 dist 必须判未判定）
        run: npm run verify:notices-selftest

      # 体积自检要一份**真实产物**做样本（它在临时目录里真复制一份再施加变异）。
      # 本 job 原本不建产物，缺 dist 时自检会按零样本纪律判「未判定」并 exit 2 —— 故先构建。
      - name: 生产构建（体积自检的样本）
        run: npm run build

      - name: 产物体积判据的变异自检（10 个变异体：删 wasm / 同大小换内容 / web 注入 / SHA256SUMS 漂移 / 缺 dist / 软链 node_modules / 原始总字节顶穿 / 源码同源前提的对照与漂移 / 对照）
        run: npm run verify:size-selftest

      # 13 个阳性形态（.bak 令牌 / .pem 私钥 / 新式令牌前缀 / 超大文本 / OpenSSH 私钥 / 跟踪的 .env / 公网 IP / Tailscale / 媒体）
      # 必须全部被抓；2 组阴性对照必须零误报；「索引有而工作区缺失」必须判未判定（exit 2）；闸门自扫不得自阻断
      - name: 发布卫生闸门的变异自检（17 阳性（含两个二进制旁路形态）+ 3 阴性 + 未判定语义 + 自扫）
        run: npm run verify:publish-selftest

      # 每个场景建独立临时 git 仓库：空样本（.gitattributes 只剩注释 / public/SHA256SUMS 0 字节）必须判未判定，
      # 读不到的配置（缺失 / 是目录 / 权限 000 / 不是 git 仓库）必须 exit 2 且不裸栈；阴性对照证明修复前确实假通过
      - name: 配置卫生判据的零样本与健壮性自检（9 场景 + 2 阴性对照）
        run: npm run verify:hygiene-selftest

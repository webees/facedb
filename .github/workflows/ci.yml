name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 自检 / 类型检查 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 仓库自检（资源指纹 / 迁移不变量 / 文案键对称 / 二进制指纹）
        run: npm run verify

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - name: Docker Compose 配置校验
        run: docker compose config -q

name: 需求 / 改进建议
description: 提出新功能、体验改进或文档改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案与取舍
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 影响面
      options:
        - label: 前端采集流程（src/）
        - label: 后端 schema / 约束（pb_migrations/）
        - label: 部署与构建（Dockerfile、docker-compose.yml、pb-bin/）
        - label: 文档（RUN.md、README.md、docs/）

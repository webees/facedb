name: 缺陷报告
description: 报告一个可复现的功能缺陷或行为不一致
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请**不要**在公开 Issue 里粘贴真实采集数据（照片、视频、采集编号、`pb_data/` 内容）。
        安全问题请改用仓库的 **Security → Advisories** 私密渠道，见 `SECURITY.md`。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么？期望发生什么？
      placeholder: 例如：走完六步后提示「上传失败」，但后台已存在记录。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好：访问的链接形态、操作序列、重复次数。
      placeholder: |
        1. 访问 http://localhost:3000/<采集编号>
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: `git rev-parse --short HEAD`，或镜像标签。
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 运行环境
      multiple: true
      options:
        - Docker Compose（本地）
        - 自建服务器部署
        - 开发模式（npm run dev）
        - 其他
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      placeholder: 例如 Chrome 154 / Safari 18
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 控制台输出、网络请求状态码、截图（请遮掉人脸与采集编号）。
      render: shell
    validations:
      required: false
